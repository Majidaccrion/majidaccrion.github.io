<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Accrion Accountants logo">
  <defs>
    <linearGradient id="navyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24467e"/>
      <stop offset="0.55" stop-color="#16305e"/>
      <stop offset="1" stop-color="#0d1c3a"/>
    </linearGradient>
    <linearGradient id="navyG2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1c3a"/>
      <stop offset="0.5" stop-color="#1b3a6e"/>
      <stop offset="1" stop-color="#2c4f8c"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#e7c87e"/>
      <stop offset="0.5" stop-color="#c99f42"/>
      <stop offset="1" stop-color="#a87f28"/>
    </linearGradient>
  </defs>

  <!-- Right leg of the A (gold), tucked behind the navy apex, flared foot -->
  <path d="M272 108 L318 108 L432 430 L372 430 C366 372 336 240 272 108 Z" fill="url(#goldG)"/>

  <!-- Left leg + pointed apex of the A (navy) -->
  <path d="M258 48 L286 92 L192 430 L132 430 Z" fill="url(#navyG)"/>

  <!-- Ground sweep -->
  <path d="M104 442 Q256 484 408 440 Q256 462 104 442 Z" fill="url(#navyG)"/>

  <!-- Rising bars -->
  <rect x="212" y="374" width="23" height="56" rx="2" fill="url(#navyG)"/>
  <rect x="243" y="342" width="23" height="88" rx="2" fill="url(#navyG)"/>
  <rect x="274" y="306" width="23" height="124" rx="2" fill="url(#navyG)"/>
  <rect x="305" y="260" width="29" height="170" rx="2" fill="url(#goldG)"/>

  <!-- Sweeping ribbon (tapered) -->
  <path d="M42 424 C168 402 306 302 452 118 C338 244 214 352 52 396 Z" fill="url(#navyG2)"/>

  <!-- Ascending gold dots -->
  <circle cx="458" cy="100" r="11" fill="url(#goldG)"/>
  <circle cx="478" cy="71" r="8.5" fill="url(#goldG)"/>
  <circle cx="492" cy="46" r="6.5" fill="url(#goldG)"/>
  <circle cx="503" cy="25" r="5" fill="url(#goldG)"/>
</svg>
